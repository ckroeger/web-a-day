<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA Hub Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050510;
            --glass: rgba(20, 25, 45, 0.45);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(161, 140, 209, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        * { box-sizing: inherit; }
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header h1 span {
            font-weight: 300;
            background: #fff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px;
            border-radius: 12px;
            overflow-x: auto;
        }
        .tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            white-space: nowrap;
        }
        .tab.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .btn-download {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.3);
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.5);
        }
        .btn-download svg { width: 16px; height: 16px; fill: currentColor; }
        
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Timeline / Gantt */
        .timeline-wrapper {
            position: relative;
            width: 100%;
            height: 450px;
            padding: 40px 0;
            overflow: hidden;
        }
        .timeline-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
        }
        .timeline-month {
            flex: 1;
            border-left: 1px solid var(--border);
            padding-left: 8px;
            color: #64748b;
            font-size: 12px;
            padding-top: 12px;
        }
        .today-line {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: #00f2fe;
            z-index: 10;
            box-shadow: 0 0 15px #00f2fe;
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px #00f2fe; }
            50% { box-shadow: 0 0 20px #00f2fe; }
            100% { box-shadow: 0 0 5px #00f2fe; }
        }
        .today-label {
            position: absolute;
            top: 12px;
            background: #00f2fe;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            transform: translateX(-50%);
        }
        .tracks-container {
            position: relative;
            margin-top: 40px;
            z-index: 5;
        }
        .track {
            position: relative;
            height: 60px;
            margin-bottom: 20px;
        }
        .bar {
            position: absolute;
            height: 40px;
            top: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .bar:hover { transform: scale(1.02); z-index: 20; }
        .bar.ongoing {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }
        .card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-header h3 { margin: 0; font-size: 18px; line-height: 1.3; }
        .status { font-size: 10px; padding: 4px 8px; border-radius: 12px; font-weight: 800; text-transform: uppercase; }
        .status.ongoing { background: rgba(0, 242, 254, 0.2); color: #00f2fe; }
        .status.completed { background: rgba(161, 140, 209, 0.2); color: #a18cd1; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 16px; font-size: 11px; }

        /* List */
        .list-table-container { overflow-x: auto; }
        .list-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 800px; }
        .list-table th { padding: 16px; border-bottom: 1px solid var(--border); color: #94a3b8; font-size: 14px; }
        .list-table td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
        .list-table tr:hover { background: rgba(255,255,255,0.02); }

        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
        .month-block { padding: 16px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
        .day-header { text-align: center; font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            padding: 4px;
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            transition: background 0.2s;
        }
        .day-cell:hover { background: rgba(255,255,255,0.1); }
        .day-cell.today {
            border: 1px solid #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4) inset, 0 0 10px rgba(0, 242, 254, 0.4);
            background: rgba(0, 242, 254, 0.1);
        }
        .day-indicator { width: 100%; height: 4px; border-radius: 2px; margin-top: 2px; }

        /* Playback */
        .playback-controls { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; align-items: center; margin-bottom: 24px; }
        .btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.primary { background: #00f2fe; color: #000; border: none; }
        .pb-cursor { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 20; box-shadow: 0 0 15px 2px #fff; pointer-events: none; }
        .pb-trail { position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: #fff; border-radius: 4px; }
        .pb-callout { position: absolute; bottom: 100%; left: 10px; margin-bottom: 8px; padding: 8px 12px; font-size: 12px; color: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 30; border-left: 3px solid #fff; background: rgba(15,20,35,0.9); border-radius: 4px; }

        /* Tooltip */
        .tooltip { position: absolute; pointer-events: none; z-index: 1000; background: rgba(15, 20, 35, 0.95); padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #fff; opacity: 0; transition: opacity 0.1s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); max-width: 300px; }
    </style>
</head>
<body>
    <div class="header glass-panel">
        <h1>ARENA <span>Dashboard</span></h1>
        <nav class="tabs">
            <button class="tab active" data-target="view-gantt">Gantt</button>
            <button class="tab" data-target="view-cards">Cards</button>
            <button class="tab" data-target="view-list">List</button>
            <button class="tab" data-target="view-calendar">Calendar</button>
            <button class="tab" data-target="view-playback">Playback</button>
        </nav>
        <button class="btn-download" onclick="downloadDashboard()">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Download HTML
        </button>
    </div>

    <!-- Views Container -->
    <div id="view-gantt" class="view active"></div>
    <div id="view-cards" class="view"></div>
    <div id="view-list" class="view"></div>
    <div id="view-calendar" class="view"></div>
    <div id="view-playback" class="view">
        <div class="playback-controls glass-panel">
            <button class="btn primary" id="btn-play">Play</button>
            <button class="btn" id="btn-pause">Pause</button>
            <button class="btn" id="btn-reset">Reset</button>
            <select class="btn" id="sel-speed" style="background: rgba(0,0,0,0.3);">
                <option value="1">1x Speed</option>
                <option value="2">2x Speed</option>
                <option value="4">4x Speed</option>
            </select>
            <div id="pb-date" style="margin-left:auto; font-weight:800; font-size:18px; color:#00f2fe;">01.04.2026</div>
        </div>
        <div id="pb-stage" class="glass-panel timeline-wrapper"></div>
    </div>

    <!-- Global Tooltip -->
    <div id="tooltip" class="tooltip"></div>

    <script>
        // Data Basis
        const projects = [
            { id: "p1", name: "Opportunity HUB goes ARENA HUB", start: new Date("2026-07-14T00:00:00"), end: new Date("2026-08-10T23:59:59"), ongoing: true, themen: ["Agentic SLDC", "Claude", "Setup Brownfield", "Vorgehensmodell"], wer: ["Tobias Torkler", "Michael Umov"], color: "#00f2fe" },
            { id: "p2", name: "ARENA Hub reloaded", start: new Date("2026-07-06T00:00:00"), end: new Date("2026-08-10T23:59:59"), ongoing: true, themen: ["Agentic SLDC", "Claude", "GitOps"], wer: ["Thomas Fritsche (PO)", "Dominik Jacob", "Joey Rösner", "Jessy Osei", "Sascha Dederer"], color: "#4facfe" },
            { id: "p3", name: "Opportunity Hub", start: new Date("2026-05-27T00:00:00"), end: new Date("2026-08-10T23:59:59"), ongoing: true, themen: ["Agentic SLDC", "Claude", "GitOps", "Hop-on / Hop-off"], wer: ["Sören Wohlers (PO)", "Jan Prien", "Sebastian Frick", "Alexis Cerna", "Sulan Abubakarov", "Florian Hagen", "Thomas Fritsche"], color: "#f093fb" },
            { id: "p4", name: "ARENA Hub", start: new Date("2026-04-07T00:00:00"), end: new Date("2026-04-30T23:59:59"), ongoing: false, themen: ["Klassische Webapp", "Frontend: Angular", "Backend: Spring Boot"], wer: ["Thorsten Rodenhäuser (PO)", "Max Semdner", "Florian Hagen", "Jan Prien", "Sascha Dederer", "Mohamed Mukhtar"], color: "#a18cd1" }
        ];

        // Timeline Constants
        const tsStart = new Date("2026-04-01T00:00:00").getTime();
        const tsEnd = new Date("2026-08-31T23:59:59").getTime();
        const tsTotal = tsEnd - tsStart;
        const todayDate = new Date("2026-08-10T12:00:00");
        const months = [{ y: 2026, m: 3, name: "April" }, { y: 2026, m: 4, name: "Mai" }, { y: 2026, m: 5, name: "Juni" }, { y: 2026, m: 6, name: "Juli" }, { y: 2026, m: 7, name: "August" }];

        // Helpers
        function getPos(date) { return ((date.getTime() - tsStart) / tsTotal) * 100; }
        function formatDate(d) { return d.toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'}); }
        const tooltipsData = {};

        // 1. Gantt View
        function renderGantt() {
            let html = '<div class="glass-panel timeline-wrapper"><div class="timeline-grid">';
            months.forEach(m => html += `<div class="timeline-month">${m.name}</div>`);
            html += `</div><div class="today-line" style="left: ${getPos(todayDate)}%"><div class="today-label">Heute (10.08)</div></div><div class="tracks-container">`;
            
            projects.forEach((p, i) => {
                const left = getPos(p.start);
                const width = getPos(p.end) - left;
                const tId = 'tt_gantt_' + i;
                tooltipsData[tId] = `<div style="margin-bottom:8px"><strong style="color:${p.color}">${p.name}</strong><br><span style="font-size:11px; color:#aaa;">${formatDate(p.start)} - ${p.ongoing ? 'Heute' : formatDate(p.end)}</span><br><br><strong style="font-size:11px;">Themen:</strong><br><span style="font-size:11px; color:#aaa;">${p.themen.join(', ')}</span><br><br><strong style="font-size:11px;">Team:</strong><br><span style="font-size:11px; color:#aaa;">${p.wer.join(', ')}</span></div>`;
                
                html += `
                    <div class="track">
                        <div class="bar ${p.ongoing ? 'ongoing' : ''}" style="left: ${left}%; width: ${width}%; background: ${p.color};" data-tt="${tId}">
                            <span style="flex-grow:1; overflow:hidden; text-overflow:ellipsis;">${p.name}</span>
                            ${!p.ongoing ? '<span style="font-size:10px; background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; margin-left:8px;">✓ Abgeschlossen</span>' : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div></div>';
            document.getElementById('view-gantt').innerHTML = html;
        }

        // 2. Cards View
        function renderCards() {
            let html = '<div class="cards-grid">';
            projects.forEach(p => {
                html += `
                    <div class="card glass-panel" style="border-top: 4px solid ${p.color}">
                        <div class="card-header">
                            <h3 style="color: ${p.color}">${p.name}</h3>
                            <span class="status ${p.ongoing ? 'ongoing' : 'completed'}">${p.ongoing ? 'Laufend' : 'Abgeschlossen'}</span>
                        </div>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top:-8px;">${formatDate(p.start)} – ${p.ongoing ? 'Heute' : formatDate(p.end)}</div>
                        <div>
                            <div style="font-size:11px; text-transform:uppercase; color:#64748b; margin-bottom:8px; font-weight:600;">Themen</div>
                            <div class="tags">${p.themen.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                        </div>
                        <div>
                            <div style="font-size:11px; text-transform:uppercase; color:#64748b; margin-bottom:8px; font-weight:600;">Team</div>
                            <div style="font-size:13px; color:#cbd5e1; line-height:1.5;">${p.wer.join(', ')}</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('view-cards').innerHTML = html;
        }

        // 3. Compact List
        function renderList() {
            let html = '<div class="glass-panel list-table-container"><table class="list-table"><thead><tr><th>Status</th><th>Projekt</th><th>Zeitraum</th><th>Themen</th><th>Team</th></tr></thead><tbody>';
            projects.forEach(p => {
                html += `
                    <tr>
                        <td>
                            <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${p.color}; box-shadow: 0 0 8px ${p.color};"></span>
                            <span style="margin-left:8px; font-size:12px;">${p.ongoing ? 'Laufend' : 'Abgeschlossen'}</span>
                        </td>
                        <td style="font-weight:600; color:${p.color}">${p.name}</td>
                        <td style="font-size:13px;">${formatDate(p.start)} – ${p.ongoing ? 'Heute' : formatDate(p.end)}</td>
                        <td style="font-size:12px; color:#aaa;">${p.themen.join('<br>')}</td>
                        <td style="font-size:12px; color:#aaa;">${p.wer.join(', ')}</td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            document.getElementById('view-list').innerHTML = html;
        }

        // 4. Calendar View
        function renderCalendar() {
            let html = '<div class="calendar-grid">';
            months.forEach(month => {
                html += `<div class="month-block glass-panel"><h3 style="margin-top:0; text-align:center; margin-bottom:12px;">${month.name}</h3><div class="days-grid"><div class="day-header">Mo</div><div class="day-header">Di</div><div class="day-header">Mi</div><div class="day-header">Do</div><div class="day-header">Fr</div><div class="day-header">Sa</div><div class="day-header">So</div>`;
                
                const daysInMonth = new Date(month.y, month.m + 1, 0).getDate();
                let startDay = new Date(month.y, month.m, 1).getDay();
                if (startDay === 0) startDay = 7;
                
                for (let i = 1; i < startDay; i++) html += `<div></div>`;
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const current = new Date(month.y, month.m, d, 12, 0, 0);
                    const isToday = (current.getFullYear() === 2026 && current.getMonth() === 7 && current.getDate() === 10);
                    const activeProjects = projects.filter(p => current >= p.start && current <= p.end);
                    
                    let indicators = activeProjects.map(p => `<div class="day-indicator" style="background:${p.color}"></div>`).join('');
                    let classes = isToday ? "day-cell today" : "day-cell";
                    let ttAttr = "";
                    
                    if (activeProjects.length > 0) {
                        const tId = `tt_cal_${month.m}_${d}`;
                        tooltipsData[tId] = activeProjects.map(p => `<div style="margin-bottom:8px"><strong style="color:${p.color}">${p.name}</strong><br><span style="font-size:11px; color:#aaa;">${p.themen.join(', ')}</span></div>`).join('');
                        ttAttr = `data-tt="${tId}"`;
                    }
                    
                    html += `<div class="${classes}" ${ttAttr}><span>${d}</span><div style="width:100%; margin-top:2px;">${indicators}</div></div>`;
                }
                html += `</div></div>`;
            });
            html += '</div>';
            document.getElementById('view-calendar').innerHTML = html;
        }

        // 5. Playback View
        let isPlaying = false;
        let pbTime = tsStart;
        let lastFrameTime = 0;
        let pbAnimId;
        const activeCallouts = {};

        function initPlayback() {
            let html = '<div class="timeline-grid">';
            months.forEach(m => html += `<div class="timeline-month">${m.name}</div>`);
            html += `</div><div class="today-line" style="left: ${getPos(todayDate)}%"><div class="today-label">Heute (10.08)</div></div>`;
            html += `<div id="pb-cursor" class="pb-cursor" style="left: 0%"></div><div class="tracks-container">`;
            
            projects.forEach(p => {
                html += `
                    <div class="track">
                        <div id="pb-bar-${p.id}" class="bar" style="left: ${getPos(p.start)}%; width: 0%; background: ${p.color}; pointer-events: none;">
                            <div id="pb-trail-${p.id}" class="pb-trail" style="display:none; box-shadow: 0 0 15px 5px ${p.color};"></div>
                            <span style="padding-left:12px; flex-grow:1; overflow:hidden; text-overflow:ellipsis;">${p.name}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('pb-stage').innerHTML = html;
            updatePlaybackUI();
        }

        function updatePlaybackUI() {
            const cursor = document.getElementById('pb-cursor');
            cursor.style.left = getPos(new Date(pbTime)) + '%';
            document.getElementById('pb-date').innerText = new Date(pbTime).toLocaleDateString('de-DE', {day: '2-digit', month: '2-digit', year: 'numeric'});
            
            projects.forEach(p => {
                const bar = document.getElementById(`pb-bar-${p.id}`);
                const trail = document.getElementById(`pb-trail-${p.id}`);
                const pStart = p.start.getTime();
                const pEnd = p.end.getTime();
                
                if (pbTime >= pStart) {
                    const currentEnd = Math.min(pbTime, pEnd);
                    const widthPct = ((currentEnd - pStart) / tsTotal) * 100;
                    bar.style.width = widthPct + '%';
                    trail.style.display = (pbTime < pEnd) ? 'block' : 'none';
                    
                    // Callouts
                    if (pbTime < pEnd && !activeCallouts[p.id]) {
                        showCallout(p);
                        activeCallouts[p.id] = true;
                    }
                } else {
                    bar.style.width = '0%';
                    trail.style.display = 'none';
                    activeCallouts[p.id] = false;
                }
            });
        }

        function showCallout(p) {
            const bar = document.getElementById(`pb-bar-${p.id}`);
            const callout = document.createElement('div');
            callout.className = 'pb-callout';
            callout.style.borderColor = p.color;
            callout.innerHTML = `<strong style="color:${p.color}">${p.name}</strong><br><span style="font-size:10px">${p.wer[0]} & ${p.wer.length-1} weitere</span>`;
            bar.appendChild(callout);
            setTimeout(() => callout.style.opacity = 1, 50);
            setTimeout(() => {
                if(callout && callout.parentNode) {
                    callout.style.opacity = 0;
                    setTimeout(() => callout.remove(), 300);
                }
            }, 2500);
        }

        function playbackLoop(time) {
            if (!isPlaying) return;
            const delta = time - lastFrameTime;
            lastFrameTime = time;
            
            const speed = parseInt(document.getElementById('sel-speed').value);
            const msPerDayRealTime = 100; // 100ms = 1 day
            const daysPassed = (delta / msPerDayRealTime) * speed;
            
            pbTime += daysPassed * 24 * 60 * 60 * 1000;
            
            if (pbTime >= todayDate.getTime()) {
                pbTime = todayDate.getTime();
                isPlaying = false;
            }
            
            updatePlaybackUI();
            if (isPlaying) pbAnimId = requestAnimationFrame(playbackLoop);
        }

        document.getElementById('btn-play').addEventListener('click', () => {
            if (pbTime >= todayDate.getTime()) pbTime = tsStart;
            isPlaying = true;
            lastFrameTime = performance.now();
            pbAnimId = requestAnimationFrame(playbackLoop);
        });
        document.getElementById('btn-pause').addEventListener('click', () => isPlaying = false);
        document.getElementById('btn-reset').addEventListener('click', () => {
            isPlaying = false;
            pbTime = tsStart;
            document.querySelectorAll('.pb-callout').forEach(e => e.remove());
            for(let k in activeCallouts) activeCallouts[k] = false;
            updatePlaybackUI();
        });

        // Download Feature
        function downloadDashboard() {
            const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ARENA_Dashboard.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Init All
        document.addEventListener('DOMContentLoaded', () => {
            renderGantt();
            renderCards();
            renderList();
            renderCalendar();
            initPlayback();
            
            // Tabs setup
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.target).classList.add('active');
                });
            });

            // Global Tooltip Logic
            document.addEventListener('mouseover', e => {
                const target = e.target.closest('[data-tt]');
                if (target) {
                    const tt = document.getElementById('tooltip');
                    tt.innerHTML = tooltipsData[target.getAttribute('data-tt')];
                    tt.style.opacity = 1;
                }
            });
            document.addEventListener('mouseout', e => {
                if (e.target.closest('[data-tt]')) {
                    document.getElementById('tooltip').style.opacity = 0;
                }
            });
            document.addEventListener('mousemove', e => {
                const tt = document.getElementById('tooltip');
                if (tt.style.opacity === '1') {
                    tt.style.left = e.pageX + 15 + 'px';
                    tt.style.top = e.pageY + 15 + 'px';
                }
            });
        });
    </script>
</body>
</html>
